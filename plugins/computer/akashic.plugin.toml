schema_version = 1
name = "computer"
version = "1.0.0"
api_version = 3
entrypoint = "plugin.py"

[validation]
exclude_data_paths = [
  "state/config/pulse",
  "state/config/xfce4/desktop/icons.screen.latest.rc",
  "state/home/.opencli/node_modules",
  "state/profile/SingletonCookie",
  "state/profile/SingletonLock",
  "state/profile/SingletonSocket",
]

[[workloads]]
name = "computer"
image = "ghcr.io/kachofugetsu09/akashic-computer@sha256:261a8374b7b0424a54beadbde90030dd7aec164daad196df24f3e2a6ad155b54"
command = ["/opt/computer/start.sh"]
user_namespaces = true

[[workloads.ports]]
name = "gateway"
number = 8080

[[workloads.ports]]
name = "display"
number = 6080

[[workloads.ports]]
name = "opencli"
number = 19826
loopback = 19825

[[workloads.data]]
name = "state"
target = "/data"
writable = true

[workloads.health]
port = "gateway"
path = "/health"
timeout_seconds = 90

[workloads.limits]
memory_mb = 2048
cpu_count = 2.0
pids = 512

[[mcp_servers]]
name = "computer"
command = ["mcp_server.py"]
required_tools = ["browser_observe", "browser_action", "computer_observe", "computer_action"]
candidate_read_only_tools = ["browser_observe", "computer_observe"]

[[mcp_servers.workload_env]]
env = "COMPUTER_URL"
workload = "computer"
port = "gateway"

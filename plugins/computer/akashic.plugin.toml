schema_version = 1
name = "computer"
version = "1.0.0"
api_version = 3
entrypoint = "plugin.py"

[[workloads]]
name = "computer"
image = "ghcr.io/kachofugetsu09/akashic-computer@sha256:4e3abb85a16d081303bf520e67eb725781aa39f459048fbdc5b081b217abae3c"
command = ["/opt/computer/start.sh"]

[[workloads.ports]]
name = "gateway"
number = 8080

[[workloads.ports]]
name = "opencli"
number = 19826
loopback = 19826

[[workloads.data]]
name = "state"
target = "/data"
writable = true

[workloads.health]
port = "gateway"
path = "/health"
timeout_seconds = 90

[workloads.limits]
memory_mb = 2048
cpu_count = 2.0
pids = 512

[[mcp_servers]]
name = "computer"
command = ["mcp_server.py"]
required_tools = ["browser_observe", "browser_action", "computer_observe", "computer_action"]
candidate_read_only_tools = ["browser_observe", "computer_observe"]

[[mcp_servers.workload_env]]
env = "COMPUTER_URL"
workload = "computer"
port = "gateway"

version = 1

[defaults]
baseline_scenarios = ["contract_catalog", "workspace_bootstrap"]
executable_suffixes = [
  ".cjs",
  ".js",
  ".json",
  ".mjs",
  ".py",
  ".sh",
  ".sql",
  ".toml",
  ".ts",
  ".tsx",
  ".yaml",
  ".yml",
]
executable_names = ["Dockerfile"]
always_full_paths = [
  ".github/workflows/**",
  "docker/debug/gate.py",
  "docker/debug/docker-compose.change-gate.yml",
  "docs/projectneed.md",
  "tests/semantic/**",
  "tests_scenarios/contracts/**",
]

[groups.context_projection]
priority = "p0"
requirements = ["CTX-001", "CTX-002", "SES-003", "SES-005", "TST-001", "TST-003"]
paths = [
  "agent/prompting/**",
  "agent/plugin_composition/session_read.py",
  "plugins/context/**",
  "plugins/conversation/**",
  "plugins/reply/**",
  "plugins/sources/**",
]
deleted_paths = ["agent/policies/history_route.py"]
depends_on = ["session_persistence"]
scenarios = ["context_history_nondestructive"]

[groups.session_persistence]
priority = "p0"
requirements = ["SES-002", "SES-003", "SES-005", "TST-002", "TST-005"]
paths = ["session/**", "infra/persistence/**"]
depends_on = []
scenarios = ["context_history_nondestructive"]

[groups.mobile_realtime]
priority = "p0"
requirements = ["OUT-001", "OUT-002", "PLG-003", "PLG-008", "SES-002", "SES-005", "SES-006", "TST-001", "TST-003"]
paths = [
  "infra/mobile_realtime/**",
  "agent/plugins/**",
  "agent/turns/outbound.py",
  "bootstrap/app.py",
  "bootstrap/app_server.py",
  "bootstrap/channel_host.py",
  "bootstrap/channels.py",
  "bootstrap/chat_api.py",
  "bus/events.py",
  "bus/events_lifecycle.py",
  "agent/turn_events/**",
  "plugins/akasha/**",
  "plugins/conversation/**",
  "plugins/reply/**",
  "plugins/sources/**",
  "plugins/wake/**",
  "schema/mobile-realtime-v1.json",
  "schema/archive/mobile-realtime-v1-mobile-pr6.json",
  "scripts/generate_mobile_realtime_schema.py",
  "tests/mobile_realtime/**",
  "tests_scenarios/mobile_isolated_gateway.py",
]
depends_on = ["channel", "plugin", "session_persistence"]
scenarios = ["mobile_realtime_contract"]

[groups.mobile_webui]
priority = "p1"
requirements = [
  "WEBUI-001",
  "WEBUI-002",
  "WEBUI-003",
  "WEBUI-004",
  "WEBUI-005",
  "WEBUI-006",
  "MOB-001",
  "CAP-001",
  "CAP-002",
  "ERR-001",
  "TST-001",
  "TST-002",
  "TST-005",
  "TST-006",
  "TST-007",
  "TST-008",
]
paths = [
  "frontend/chat/**",
  "infra/mobile_realtime/gateway.py",
  "infra/mobile_realtime/protocol.py",
  "infra/mobile_webui/**",
  "package-lock.json",
  "schema/mobile-realtime-v1.json",
  "scripts/generate_mobile_realtime_schema.py",
  "scripts/publish-mobile-webui.py",
  "tests/mobile_webui/**",
]
depends_on = ["mobile_realtime"]
scenarios = ["mobile_webui_contract"]

[groups.mcp]
priority = "p0"
requirements = ["PLG-004", "PLG-008", "PLG-009", "TST-001", "TST-003"]
paths = [
  "agent/mcp/**",
]
depends_on = ["plugin", "lifecycle"]
scenarios = ["mcp_call_finality", "mcp_process_lifecycle"]

[groups.plugin]
priority = "p0"
requirements = ["PLG-001", "PLG-004", "PLG-009", "PLG-017", "RUN-016", "WSP-006"]
paths = [
  "agent/plugin_composition/**",
  "agent/plugin_contracts/**",
  "agent/plugins/**",
  "agent/workloads/**",
  "docker/computer/**",
  "examples/plugin_composition/**",
  "packages/akashic-web-ui-v1/**",
  "packages/akashic-workbench-ui-v2/**",
  "packages/akashic-models-ui-v1/**",
  "plugin_boundary.toml",
  "plugin_boundary_baseline.toml",
  "plugins/**",
  "scripts/plugin_boundary.py",
  "scripts/plugin_composition_experiment.py",
  "bootstrap/tools.py",
  "tests/test_plugin_*.py",
]
deleted_paths = [
  "agent/tool_hooks/**",
]
depends_on = ["lifecycle"]
scenarios = ["plugin_generation_contract", "plugin_workload_contract", "plugin_uninstall_drain_finality", "mcp_process_lifecycle", "plugin_domain_observe_events"]

[groups.model_owner]
priority = "p0"
requirements = ["RUN-005", "RUN-009", "RUN-010", "RUN-011", "RUN-012", "TST-001", "TST-003"]
paths = [
  "agent/plugin_composition/*model*.py",
  "agent/plugin_composition/models.py",
  "agent/plugin_composition/__init__.py",
  "agent/plugins/model_*.py",
  "agent/plugins/snapshot.py",
  "agent/tools/filesystem.py",
  "agent/migrations/akasha_*.py",
  "agent/model_runtime/**",
  "bootstrap/app.py",
  "bootstrap/chat_api.py",
  "bootstrap/init_workspace.py",
  "bootstrap/setup_wizard.py",
  "bootstrap/web_shell.py",
  "packages/akashic-models-ui-v1/**",
  "plugins/models/**",
  "plugins/openai_compatible/**",
  "plugins/codex/**",
  "plugins/opencode_go/**",
  "plugins/akasha/**",
  "plugins/compaction/**",
  "plugins/markdown_memory/**",
  "migrations/akasha_*/**",
  "docker/debug/model_plugin_fixture.py",
  "docker/debug/akasha_v2_runtime_probe.py",
  "docker/debug/programmatic_control_probe.py",
  "docker/debug/*model*.py",
  "docker/debug/wake_v3_provider_e2e.py",
  "eval/**",
  "benchmark/harbor_v4flash/**",
  "migrations/yoyo/*model*.py",
  "tests/model_plugin_fakes.py",
  "tests/test_*model*.py",
  "tests/semantic/test_model_owner_contract.py",
]
deleted_paths = ["agent/provider.py", "agent/tools/vision.py", "bootstrap/providers.py"]
depends_on = ["plugin", "runtime"]
scenarios = ["model_owner_contract"]

[groups.recursive_plugin_validation]
priority = "p0"
requirements = ["RUN-007", "OUT-004", "PLG-013", "CTRL-003", "TST-001", "TST-002", "TST-003", "TST-005", "TST-006"]
paths = [
  "agent/control/**",
  "agent/looping/**",
  "agent/plugin_composition/events.py",
  "agent/plugin_composition/runtime_lifecycle.py",
  "agent/plugin_composition/session_read.py",
  "agent/plugin_composition/tasks.py",
  "agent/plugins/**",
  "bootstrap/tools.py",
  "bus/queue.py",
  "infra/control/**",
  "main.py",
  "session/**",
  "skills/develop-akashic-plugin/**",
  "tests/control/**",
  "tests/semantic/test_recursive_plugin_self_validation_contract.py",
  "tests/test_plugin_hot_reload.py",
  "tests/test_plugin_runtime_control.py",
]
deleted_paths = ["agent/tools/message_push.py"]
depends_on = ["plugin", "control", "session_persistence", "channel", "memory"]
scenarios = ["recursive_plugin_self_validation_contract"]

[groups.lifecycle]
priority = "p1"
requirements = ["RUN-001", "RUN-002", "PLG-001"]
paths = [
  "agent/plugin_composition/events.py",
  "agent/plugin_composition/runtime_lifecycle.py",
  "agent/plugin_composition/tasks.py",
  "agent/turn_events/**",
  "bootstrap/runtime_readiness.py",
]
depends_on = ["events"]
scenarios = ["contract_catalog", "plugin_generation_contract", "plugin_domain_observe_events"]

[groups.events]
priority = "p1"
requirements = ["RUN-001", "OUT-001"]
paths = ["bus/**", "agent/tools/events.py", "agent/tools/executor.py"]
depends_on = []
scenarios = ["contract_catalog", "plugin_domain_observe_events"]

[groups.channel]
priority = "p1"
requirements = ["OUT-001", "OUT-002", "COM-001"]
paths = ["infra/channels/**", "bootstrap/channel_host.py", "bootstrap/channels.py"]
depends_on = ["events"]
scenarios = ["contract_catalog"]

[groups.content_wake_drift]
priority = "p1"
requirements = ["PRO-001", "PRO-002", "OUT-001"]
paths = [
  "plugins/eventmail/**",
  "plugins/wake/**",
  "plugins/drift/**",
  "tests/test_wake_*.py",
]
depends_on = ["events", "plugin"]
scenarios = ["content_wake_delivery_contract"]

[groups.memory]
priority = "p0"
requirements = ["MEM-001", "MEM-002", "MEM-003", "SES-005", "WSP-004"]
paths = [
  "core/memory/**",
  "memory2/**",
  "plugins/compaction/**",
  "plugins/markdown_memory/**",
]
deleted_paths = [
  "agent/tools/forget_memory.py",
  "agent/tools/memorize.py",
  "agent/tools/recall_memory.py",
]
depends_on = ["session_persistence"]
scenarios = ["memory_persistence_contract"]

[groups.jobs]
priority = "p1"
requirements = ["SCH-001", "SCH-002"]
paths = [
  "plugins/scheduler/**",
  "agent/plugin_composition/timers.py",
  "tests/test_job_store.py",
  "tests/test_scheduler_*.py",
]
deleted_paths = ["agent/tools/schedule.py", "bootstrap/toolsets/schedule.py"]
depends_on = ["plugin"]
scenarios = ["contract_catalog"]

[groups.control]
priority = "p1"
requirements = ["COM-001", "COM-002", "ERR-001"]
paths = [
  "agent/control/**",
  "agent/looping/**",
  "agent/turns/**",
  "bootstrap/app_server.py",
  "infra/control/**",
  "tests/control/**",
]
depends_on = ["events", "session_persistence"]
scenarios = ["contract_catalog", "plugin_uninstall_drain_finality"]

[groups.runtime]
priority = "p1"
requirements = ["OBJ-003", "RUN-001", "ERR-001"]
paths = [
  "agent/*.py",
  "agent/background/**",
  "agent/config.py",
  "agent/config_models.py",
  "agent/core/**",
  "agent/plugin_composition/runtime_lifecycle.py",
  "agent/llm_json.py",
  "agent/model_runtime/**",
  "agent/persona.py",
  "agent/restart.py",
  "agent/skills.py",
  "agent/supervisor.py",
  "agent/tool_runtime.py",
  "agent/tools/**",
  "bootstrap/**",
  "core/__init__.py",
  "core/clock.py",
  "core/common/**",
  "core/error_context.py",
  "core/net/**",
  "infra/__init__.py",
  "main.py",
  "prompts/**",
  "tests/test_context_compaction_contract.py",
  "tests/test_shell_tool.py",
  "tests/test_unified_exec.py",
  "utils/**",
]
deleted_paths = [
  "agent/policies/__init__.py",
  "agent/provider.py",
  "agent/tool_bundles.py",
  "infra/providers/**",
  "proactive_v2/**",
]
depends_on = ["events", "session_persistence"]
scenarios = ["contract_catalog", "plugin_uninstall_drain_finality", "mcp_process_lifecycle", "shell_execution_contract"]

[groups.shell_finality]
priority = "p0"
requirements = ["SH-002", "RUN-003", "OUT-001", "ERR-001", "TST-001", "TST-003"]
paths = [
  "agent/background/boot_guardian.py",
  "agent/supervisor.py",
  "agent/tools/unified_exec.py",
]
deleted_paths = ["agent/tools/shell.py"]
depends_on = ["events", "session_persistence"]
scenarios = ["shell_privileged_cleanup_contract", "shell_turn_finality_contract"]

[groups.host_execution]
priority = "p0"
requirements = ["RUN-013", "RUN-014", "RUN-015", "WSP-005", "SH-001", "SH-002", "SH-003", "ERR-001", "TST-001", "TST-003", "TST-005", "TST-006"]
paths = [
  "agent/host_bridge/**",
  "agent/runtime_identity.py",
  "docker/host-runtime/**",
  "mise.toml",
  "scripts/akashic-release",
  "scripts/akashic_release/**",
  "scripts/build_host_runtime_release.py",
  "scripts/install-akashic.sh",
  "scripts/prepare_container_rehearsal.py",
  "scripts/prepare_runtime_checkout.py",
  "scripts/verify_host_runtime_deployment.py",
]
depends_on = ["runtime", "shell_finality", "session_persistence"]
scenarios = ["host_bridge_boot_fencing_contract", "shell_privileged_cleanup_contract"]

[groups.migrations]
priority = "p0"
requirements = ["MIG-001", "MIG-002", "WSP-003", "BAK-001", "TST-002", "TST-005"]
paths = [
  "agent/migrations/**",
  "migrations/**",
  "scripts/check_yoyo_migrations.py",
  "tests/test_migration_runner.py",
  "tests/test_yoyo_migration_append_only.py",
]
depends_on = ["runtime", "session_persistence"]
scenarios = ["contract_catalog", "workspace_bootstrap"]

[groups.frontend]
priority = "p2"
requirements = ["COM-001", "COM-004"]
paths = ["frontend/**", "eslint.config.js"]
depends_on = ["control"]
scenarios = ["contract_catalog"]

[groups.companion_tool_context]
priority = "p0"
requirements = ["SEC-001", "ERR-001", "TST-001", "TST-003"]
paths = [
  "agent/tools/registry.py",
  "agent/tools/base.py",
  "agent/tool_runtime.py",
  "agent/plugin_composition/session_read.py",
  "agent/plugin_composition/tasks.py",
  "plugins/context/**",
  "plugins/reply/**",
  "agent/turns/outbound.py",
]
deleted_paths = ["agent/looping/handlers.py", "agent/tools/memorize.py", "agent/tools/recall_memory.py", "agent/tools/message_push.py"]
depends_on = ["memory", "channel"]
scenarios = ["companion_tool_context_contract"]

[groups.companion_external_io]
priority = "p0"
requirements = ["SEC-002", "FS-001", "SES-006", "ERR-001", "TST-001", "TST-003"]
paths = ["core/net/http.py", "bootstrap/chat_api.py", "infra/channels/base.py", "infra/channels/delivery.py", "infra/channels/qq_channel.py", "infra/channels/telegram_channel.py", "infra/channels/web_chat_channel.py", "infra/mobile_realtime/attachments.py", "infra/mobile_realtime/channel.py", "infra/mobile_realtime/gateway.py", "infra/mobile_realtime/storage.py", "tests/mobile_realtime/test_attachments.py", "tests/mobile_realtime/test_channel.py", "tests/mobile_realtime/test_storage.py"]
deleted_paths = ["agent/tools/web_fetch.py"]
depends_on = ["runtime", "mobile_realtime"]
scenarios = ["companion_external_io_contract"]

[groups.companion_peer_removal]
priority = "p0"
requirements = ["SEC-003", "ERR-001", "TST-001", "TST-003"]
paths = ["agent/config.py", "bootstrap/tools.py"]
deleted_paths = ["agent/peer_agent/**"]
depends_on = ["runtime"]
scenarios = ["companion_peer_removal_contract"]

[groups.companion_schedule]
priority = "p0"
requirements = ["SEC-005", "SCH-001", "SCH-002", "ERR-001", "TST-001", "TST-003"]
paths = ["plugins/scheduler/**"]
deleted_paths = ["agent/tools/schedule.py"]
depends_on = ["jobs"]
scenarios = ["companion_schedule_capacity_contract"]

[groups.companion_mobile]
priority = "p0"
requirements = ["SEC-006", "MOB-003", "PLG-003", "PLG-004", "ERR-001", "TST-001", "TST-003"]
paths = ["infra/mobile_realtime/**", "agent/plugins/**", "bus/queue.py", "bootstrap/app.py", "session/store.py"]
depends_on = ["mobile_realtime", "plugin"]
scenarios = ["companion_mobile_receipt_contract"]

[groups.companion_shell]
priority = "p0"
requirements = ["SEC-007", "SH-001", "SH-002", "RUN-003", "ERR-001", "TST-001", "TST-003"]
paths = ["agent/tools/unified_exec.py", "agent/background/**"]
deleted_paths = ["agent/tools/shell.py"]
depends_on = ["shell_finality", "runtime"]
scenarios = ["companion_shell_admission_contract"]

[groups.companion_control]
priority = "p0"
requirements = ["SEC-007", "SEC-008", "CTRL-001", "CTRL-002", "ERR-001", "TST-001", "TST-003"]
paths = ["bus/**", "agent/control/**", "infra/control/**"]
depends_on = ["control", "events"]
scenarios = ["companion_control_replay_contract"]

[groups.companion_dashboard]
priority = "p0"
requirements = ["SEC-009", "ERR-001", "TST-001", "TST-003"]
paths = ["private_runtime"]
depends_on = []
scenarios = ["companion_dashboard_value_contract"]

[groups.sdk]
priority = "p2"
requirements = ["COM-002", "PLG-009"]
paths = ["sdk/**", "schema/**", "types/**"]
depends_on = []
scenarios = ["contract_catalog"]

[groups.evaluation]
priority = "p2"
requirements = ["TST-001", "TST-002"]
paths = ["benchmark/**", "eval/**"]
depends_on = ["runtime"]
scenarios = ["contract_catalog"]

[groups.tooling]
priority = "p1"
requirements = ["GOV-001", "GOV-003", "TST-001", "TST-006", "WSP-004"]
paths = [
  ".claude/**",
  ".github/**",
  ".gitmodules",
  "components.json",
  "config.example.toml",
  "docker/**",
  "docs/templates/**",
  "mise.toml",
  "package.json",
  "pytest.ini",
  "pyproject.toml",
  "pyrightconfig*.json",
  "requirements*.txt",
  "package-lock.json",
  "private_runtime",
  "scripts/**",
  "skills/**",
  "systemd/**",
  "tests/**",
  "tests_scenarios/**",
  "tsconfig.json",
]
depends_on = []
scenarios = ["contract_catalog", "workspace_bootstrap"]

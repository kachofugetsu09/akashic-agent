version = 1

[mutant_tests]
async_accepted_before_visible = "tests/semantic/test_contract_oracles.py::test_call_finality_rejects_background_refresh_mutant"
candidate_visible_before_activation = "tests/semantic/test_contract_oracles.py::test_plugin_publication_oracle_rejects_early_switch_mutant"
derived_state_overwrites_session_source = "tests/semantic/test_contract_oracles.py::test_memory_oracle_rejects_derived_state_overwrite_mutant"
historical_session_delete = "tests/semantic/test_context_history_contract.py::test_history_oracle_rejects_historical_delete_mutant"
leader_exit_assumed_tree_exit = "tests/semantic/test_contract_oracles.py::test_process_lifecycle_oracle_rejects_leader_only_cleanup_mutant"
cleanup_drops_unconfirmed_execution = "tests/semantic/test_contract_oracles.py::test_cleanup_ownership_oracle_rejects_forgetful_mutant"
cleanup_retroactively_fails_turn = "tests/semantic/test_contract_oracles.py::test_turn_finality_oracle_rejects_cleanup_failure_mutant"
missing_p0_mutant = "tests/semantic/test_change_gate.py::test_every_p0_oracle_declares_a_known_wrong_mutant"
official_workspace_path = "tests/semantic/test_contract_oracles.py::test_workspace_oracle_rejects_official_path_mutant"
plugin_uninstall_deletes_data = "tests/semantic/test_contract_oracles.py::test_plugin_data_oracle_rejects_uninstall_delete_mutant"
unicode_utf16_command_length = "tests/mobile_realtime/test_channel.py::test_command_list_uses_active_channel_catalog_without_stop"
unmapped_executable_file = "tests/semantic/test_change_gate.py::test_unknown_executable_file_is_not_silently_accepted"

[scenarios.contract_catalog]
requirements = ["GOV-001", "GOV-003", "TST-001", "TST-006"]
groups = ["tooling"]
environment = "public_clean_workspace"
timeout_seconds = 60
command = ["python", "-m", "pytest", "-q", "tests/semantic/test_change_gate.py"]
observes = ["requirements", "path_owners", "scenario_references", "p0_mutants"]
mutants = ["unmapped_executable_file", "missing_p0_mutant"]

[scenarios.workspace_bootstrap]
requirements = ["WSP-001", "WSP-004", "TST-005"]
groups = ["runtime", "tooling"]
environment = "public_clean_workspace"
timeout_seconds = 120
command = ["python", "-m", "pytest", "-q", "tests/semantic/test_gate_workspace_contract.py"]
observes = ["workspace_path", "plugin_home_path", "fresh_config"]
mutants = ["official_workspace_path"]

[scenarios.shell_execution_contract]
requirements = ["SH-001", "RUN-002", "RUN-003", "ERR-001", "TST-001", "TST-003"]
groups = ["runtime"]
environment = "public_clean_workspace"
timeout_seconds = 120
command = [
  "python",
  "-m",
  "pytest",
  "-q",
  "tests/test_shell_tool.py",
  "tests/test_unified_exec.py",
  "tests/test_agent_restart.py::test_boot_guardian_reaps_adopted_zombie_while_gateway_runs",
  "tests/test_query_compaction.py",
  "tests/test_tool_loop_guard.py::test_subagent_trim_pins_active_shell_result_until_terminal_call",
  "tests/test_tool_loop_guard.py::test_subagent_preserves_provider_failure_when_shell_cleanup_also_fails",
  "tests/proactive_v2/test_drift.py::test_drift_shell_tools_isolate_tick_owners",
  "tests/proactive_v2/test_drift.py::test_drift_preserves_execution_failure_when_shell_cleanup_fails",
]
observes = [
  "default_shell_argv",
  "short_command_exit",
  "incremental_output",
  "pty_state",
  "owner_isolation",
  "wait_cancellation",
  "stop_races",
  "process_group_cleanup",
  "zombie_only_process_group_cleanup",
  "guardian_adopted_child_reaping",
  "bounded_output",
  "capacity_pruning",
  "active_execution_compaction_pin",
  "subagent_active_execution_pin",
  "turn_owner_cleanup",
  "drift_owner_isolation",
  "cleanup_preserves_primary_error",
]
mutants = []

[scenarios.shell_turn_finality_contract]
requirements = ["SH-002", "RUN-003", "OUT-001", "ERR-001", "TST-001", "TST-003"]
groups = ["shell_finality"]
environment = "public_clean_workspace"
timeout_seconds = 180
command = [
  "python",
  "-m",
  "pytest",
  "-q",
  "tests/test_shell_tool.py::test_agent_loop_returns_completed_reply_when_shell_cleanup_fails",
  "tests/control/test_control_execution.py::test_committed_control_turn_survives_shell_cleanup_error",
  "tests/test_unified_exec.py::test_zombie_only_permission_error_does_not_fail_completed_cleanup",
  "tests/test_unified_exec.py::test_live_privileged_group_permission_error_stays_loud",
  "tests/test_unified_exec.py::test_failed_owner_cleanup_retains_execution_and_quarantines_new_spawn",
  "tests/test_agent_restart.py::test_boot_guardian_reaps_adopted_zombie_while_gateway_runs",
  "tests/test_agent_restart.py::test_supervisor_logs_cleanup_failure_and_still_starts_next_boot",
]
observes = [
  "committed_turn_status",
  "final_response",
  "dispatch_count",
  "cleanup_diagnostic",
  "execution_ownership",
  "same_owner_shell_admission",
  "guardian_adopted_child_reaping",
  "restart_generation",
]
mutants = ["cleanup_retroactively_fails_turn", "cleanup_drops_unconfirmed_execution"]

[scenarios.shell_privileged_cleanup_contract]
requirements = ["SH-002", "RUN-003", "ERR-001", "TST-001", "TST-003"]
groups = ["shell_finality"]
environment = "public_clean_workspace"
timeout_seconds = 60
command = ["gate-root-shell-cleanup"]
observes = ["real_cross_uid_process_group", "killpg_eperm", "live_process_detection"]
mutants = ["cleanup_drops_unconfirmed_execution"]

[scenarios.context_history_nondestructive]
requirements = ["CTX-001", "SES-002", "SES-003", "SES-005", "TST-002", "TST-003"]
groups = ["context_projection", "session_persistence"]
environment = "public_clean_workspace"
timeout_seconds = 120
command = ["python", "-m", "pytest", "-q", "tests/semantic/test_context_history_contract.py"]
observes = ["retry_history_windows", "messages_full_snapshot", "message_embeddings_full_snapshot", "sqlite_write_set", "restart_sequence"]
mutants = ["historical_session_delete"]

[scenarios.mobile_realtime_contract]
requirements = ["OUT-001", "OUT-002", "PLG-003", "PLG-008", "SES-002", "SES-005", "SES-006", "TST-001", "TST-003"]
groups = ["mobile_realtime"]
environment = "public_clean_workspace"
timeout_seconds = 180
command = [
  "python",
  "-m",
  "pytest",
  "-q",
  "tests/mobile_realtime",
  "tests/test_plugin_mobile_ui.py",
  "tests/test_app_server.py",
  "tests/test_channel_host.py",
]
observes = ["protocol_frames", "session_identity", "durable_delivery", "resume_cursor", "attachment_finality", "plugin_ui_snapshot"]
mutants = ["unicode_utf16_command_length"]

[scenarios.mcp_call_finality]
requirements = ["PLG-004", "PLG-008", "TST-001", "TST-003"]
groups = ["mcp"]
environment = "public_clean_workspace"
timeout_seconds = 60
command = [
  "python",
  "-m",
  "pytest",
  "-q",
  "tests/semantic/test_contract_oracles.py",
  "tests/test_mcp_declarations.py",
  "tests/test_mcp_sources_async.py",
]
observes = ["call_return", "immediate_read_after_call"]
mutants = ["async_accepted_before_visible"]

[scenarios.mcp_process_lifecycle]
requirements = ["PLG-004", "PLG-009", "RUN-001", "RUN-002", "TST-001", "TST-003"]
groups = ["mcp", "plugin", "runtime"]
environment = "public_clean_workspace"
timeout_seconds = 60
command = [
  "python",
  "-m",
  "pytest",
  "-q",
  "tests/test_io_modules.py::test_mcp_client_cleans_wrapper_process_group",
  "tests/test_io_modules.py::test_mcp_client_retains_ownership_when_process_group_cleanup_fails",
  "tests/test_plugin_service_host.py::test_managed_service_rejects_occupied_port_without_http_readiness",
  "tests/test_plugin_service_host.py::test_managed_service_cleans_listener_after_leader_exit",
  "tests/test_agent_restart.py::test_supervisor_cleans_orphaned_boot_listener",
  "tests/test_agent_restart.py::test_boot_cleanup_never_kills_unknown_listener",
  "tests/test_agent_restart.py::test_boot_guardian_cleans_double_fork_listener_after_owner_failure",
]
observes = ["leader_exit", "descendant_exit", "listener_release", "foreign_listener_survival", "cleanup_ownership"]
mutants = ["leader_exit_assumed_tree_exit"]

[scenarios.plugin_generation_contract]
requirements = ["PLG-001", "PLG-004"]
groups = ["plugin"]
environment = "public_clean_workspace"
timeout_seconds = 60
command = [
  "python",
  "-m",
  "pytest",
  "-q",
  "tests/semantic/test_contract_oracles.py::test_plugin_publication_oracle_rejects_early_switch_mutant",
  "tests/test_plugin_hot_reload.py",
  "tests/test_plugin_install.py",
]
observes = ["candidate_generation", "active_generation", "rollback"]
mutants = ["candidate_visible_before_activation", "plugin_uninstall_deletes_data"]

[scenarios.memory_persistence_contract]
requirements = ["MEM-001", "MEM-002", "SES-005"]
groups = ["memory"]
environment = "public_clean_workspace"
timeout_seconds = 60
command = [
  "python",
  "-m",
  "pytest",
  "-q",
  "tests/semantic/test_contract_oracles.py::test_memory_oracle_rejects_derived_state_overwrite_mutant",
  "tests/test_default_memory_plugin_config.py",
  "tests/test_session_store.py",
]
observes = ["long_term_owner", "session_source"]
mutants = ["derived_state_overwrites_session_source"]

[scenarios.contract_catalog]
requirements = ["GOV-001", "GOV-003", "TST-001", "TST-006"]
groups = ["tooling"]
environment = "public_clean_workspace"
timeout_seconds = 60
command = ["python", "-m", "pytest", "-q", "tests/semantic/test_change_gate.py"]
observes = ["requirements", "path_owners", "scenario_references", "p0_mutants"]

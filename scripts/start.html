<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>启动 Akashic</title>
<style>
:root{color-scheme:light dark;--paper:#f6f4ef;--ink:#26241f;--line:#777268;--accent:#36583c}
@media(prefers-color-scheme:dark){:root{--paper:#24231f;--ink:#ede9df;--line:#a39e91;--accent:#b7d4aa}}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.65 ui-serif,Georgia,serif}
main{max-width:640px;margin:12vh auto;padding:28px}header{font-size:19px;border-bottom:1px solid var(--line);padding-bottom:18px}
h1{font-size:clamp(26px,5vw,36px);line-height:1.3;margin:40px 0 20px}p{margin:16px 0}#stage{font-weight:600}#error{white-space:pre-wrap;overflow-wrap:anywhere}
button,a{font:inherit;color:inherit}button{background:transparent;border:1px solid var(--line);border-radius:6px;min-height:44px;padding:7px 18px;cursor:pointer}button.primary{background:var(--accent);color:var(--paper);border-color:var(--accent)}button:disabled{opacity:.6;cursor:wait}:focus-visible{outline:3px solid var(--accent);outline-offset:4px}
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:26px}footer{margin-top:44px;font-size:14px}a{text-underline-offset:4px}#connection{font-size:15px}
</style>
<main>
<header>Akashic</header>
<h1 id="title">正在准备你的 Akashic</h1>
<p id="stage" role="status" aria-live="polite">连接启动服务…</p>
<p id="description">首次启动会安装运行依赖、准备界面和默认功能。完成后会自动进入网页配置；模型和账号稍后再连接。</p>
<p id="error" role="alert" hidden></p>
<div class="actions"><button id="retry" class="primary" hidden>重试</button><a href="/startup.log" target="_blank" rel="noopener">查看日志</a><button id="copy">复制诊断信息</button></div>
<p id="connection" role="status"></p>
<footer>后续启动会复用已准备的文件。关闭此标签页不会停止服务。</footer>
</main>
<script>
let token='',busy=false;
const byId=id=>document.getElementById(id);
async function poll(){
 try{
  const response=await fetch('/api/startup',{cache:'no-store'});
  if(response.status===404){
   const runtime=await fetch('/api/shell/state',{cache:'no-store'});
   if(runtime.ok){
    byId('stage').textContent='正在加载已安装的功能';
    const state=await runtime.json();
    if(state.chatReady){
     const bootstrap=await fetch('/api/chat/web-ui/bootstrap',{cache:'no-store'});
     if(bootstrap.ok){location.replace('/');return;}
    }
   }
  }
  if(response.ok){
   const state=await response.json();token=state.token;
   byId('stage').textContent=state.stage;byId('error').textContent=state.error;
   byId('error').hidden=!state.error;byId('retry').hidden=!state.error;
   byId('title').textContent=state.error?'准备遇到了问题':'正在准备你的 Akashic';
   byId('connection').textContent='';
  }
 }catch{byId('connection').textContent='正在连接服务。如果启动进程已退出，请重新运行启动入口；已有数据会保留。';}
 setTimeout(poll,1000);
}
byId('retry').onclick=async()=>{
 if(busy)return;busy=true;byId('retry').disabled=true;
 try{const response=await fetch('/api/startup/retry',{method:'POST',headers:{'X-Startup-Token':token}});if(!response.ok)throw new Error('重试未被接受，请等待当前任务完成。');}
 catch(error){byId('connection').textContent=error.message;}
 finally{busy=false;byId('retry').disabled=false;}
};
byId('copy').onclick=async()=>{
 try{await navigator.clipboard.writeText([byId('stage').textContent,byId('error').textContent,location.origin+'/startup.log'].join('\n'));byId('connection').textContent='诊断信息已复制。';}
 catch{byId('connection').textContent='无法自动复制，请打开日志并手动复制需要的内容。';}
};
poll();
</script>
</html>

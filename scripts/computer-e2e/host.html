<script type="module">
import { activate as computer } from '/modules/computer/web_module.js';
import { activate as conversation } from '/modules/conversation_ui/web_module.js';
let entry, page;
const ctx = { http: {
  request: (path, options) => fetch(path, options),
  webSocketUrl: path => location.origin.replace(/^http/, 'ws') + path,
}, ui: { inject: (point, mount) => mount({ register: value => {
  if (point === 'conversation.tools.v1') entry = value; else page = value;
  return () => {};
} }) } };
computer(ctx); conversation(ctx);
page.render(document.querySelector('#host'), {child: () => ({ entries:[entry],
  render: (_id, host, view) => entry.render(host, {}, view), })});
window.e2eReady = true;

services:
  akashic:
    # README 提供固定源码提交；发行附件使用预构建镜像，不使用此 build。
    build:
      context: .
      dockerfile: docker/standalone/Dockerfile
      args:
        AKASHIC_REVISION: ${AKASHIC_REVISION:?请先按 README 设置当前源码提交}
    ports:
      - "127.0.0.1:${AKASHIC_PORT:-2236}:2236"
    volumes:
      - data:/data
    init: true
    stop_grace_period: 60s
    restart: "no"
    healthcheck:
      # 与启动器一致：聊天网关和 Web 插件目录都就绪后才显示 healthy。
      # 本机进程读门禁密钥作为凭据；未启用门禁插件时不带。
      test: ["CMD", "python", "-c", "import json,os,urllib.request as r; u='http://127.0.0.1:2236'; s='/data/workspace/web-auth/secret'; h={'Authorization':'Bearer '+open(s).read().strip()} if os.path.exists(s) else {}; assert json.load(r.urlopen(u+'/api/shell/state', timeout=3))['chatReady']; assert json.load(r.urlopen(r.Request(u+'/api/chat/web-ui/bootstrap', headers=h), timeout=3))['modules']"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 480s
volumes:
  data:

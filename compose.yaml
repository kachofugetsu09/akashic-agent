services:
  akashic:
    # README 提供固定源码提交；发行附件使用预构建镜像，不使用此 build。
    build:
      context: .
      dockerfile: docker/standalone/Dockerfile
      args:
        AKASHIC_REVISION: ${AKASHIC_REVISION:?请先按 README 设置当前源码提交}
    ports:
      - "127.0.0.1:${AKASHIC_PORT:-2236}:2236"
    environment:
      # 容器内固定监听 2236；登录链接和启动提示要打印本机实际映射的端口。
      AKASHIC_PUBLIC_PORT: ${AKASHIC_PORT:-2236}
      # 代理单独用 AKASHIC_PROXY 传入：宿主 shell 里的 127.0.0.1 代理在容器里指向容器自己，原样带入会断网。
      # 写容器能到的地址，如 http://host.docker.internal:7897（代理软件要允许局域网连接）。
      HTTP_PROXY: ${AKASHIC_PROXY:-}
      HTTPS_PROXY: ${AKASHIC_PROXY:-}
      http_proxy: ${AKASHIC_PROXY:-}
      https_proxy: ${AKASHIC_PROXY:-}
      NO_PROXY: localhost,127.0.0.1,host.docker.internal
      no_proxy: localhost,127.0.0.1,host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - data:/data
      # 跟随宿主时区；Docker Desktop 与 WSL2 同样有这个文件。
      - /etc/localtime:/etc/localtime:ro
    # 插件下载的 Chromium 要用自己的沙箱，默认 seccomp 不允许它建用户命名空间；这份配置只额外放行这些调用。
    security_opt:
      - seccomp=docker/host-runtime/chromium-seccomp.json
    init: true
    stop_grace_period: 60s
    restart: "no"
    healthcheck:
      # 与启动器一致：聊天网关和 Web 插件目录都就绪后才显示 healthy。
      # 本机进程读门禁密钥作为凭据；未启用门禁插件时不带。
      test: ["CMD", "python", "-c", "import json,os,urllib.request as r; u='http://127.0.0.1:2236'; s='/data/workspace/web-auth/secret'; h={'Authorization':'Bearer '+open(s).read().strip()} if os.path.exists(s) else {}; assert json.load(r.urlopen(u+'/api/shell/state', timeout=3))['chatReady']; assert json.load(r.urlopen(r.Request(u+'/api/chat/web-ui/bootstrap', headers=h), timeout=3))['modules']"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 480s
volumes:
  data:

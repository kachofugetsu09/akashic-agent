services:
  akashic-debug:
    build:
      context: ../..
      dockerfile: docker/debug/Dockerfile
    image: akashic-agent-debug:latest
    working_dir: /app
    environment:
      AKASHIC_DEBUG_CONFIG: /sandbox/config.toml
      AKASHIC_DEBUG_WORKSPACE: /sandbox/workspace
      AKASHIC_DASHBOARD_HOST: 0.0.0.0
      AKASHIC_DASHBOARD_PORT: "2236"
      AKASHIC_SETTINGS_HOST: "0.0.0.0"
      AKASHIC_CHAT_HOST: "0.0.0.0"
      AKASHIC_READINESS_TIMEOUT_S: "60"
      AKASHIC_HOST_GID: "${GID:-1000}"
      AKASHIC_HOST_UID: "${UID:-1000}"
      AKASHIC_DEBUG_PROFILE: "${AKASHIC_DEBUG_PROFILE:-default}"
      AKASHIC_EXTRA_PLUGIN_DIRS: /app/docker/debug/plugins
      AKASHIC_REPLAY_CHANNEL: "${AKASHIC_REPLAY_CHANNEL:-replay}"
      HOME: /sandbox/home
      PYTHONUNBUFFERED: "1"
    volumes:
      - ../..:/app
      - ./profiles/${AKASHIC_DEBUG_PROFILE:-default}:/sandbox
      - ${HOME}/.akashic-plugin/cache:/sandbox/home/.akashic-plugin/cache:ro
    ports:
      - "2237:2236"
      - "127.0.0.1:6321:6321"
      - "127.0.0.1:6322:6322"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true

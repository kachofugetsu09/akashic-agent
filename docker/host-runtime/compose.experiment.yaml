services:
  akashic-core:
    image: "${AKASHIC_IMAGE:?AKASHIC_IMAGE is required}"
    container_name: "${AKASHIC_CONTAINER_NAME:?AKASHIC_CONTAINER_NAME is required}"
    user: "${AKASHIC_UID:-1000}:${AKASHIC_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      com.akashic.observability: "true"
      com.akashic.service: "akashic-core"
      com.akashic.environment: "${AKASHIC_ENVIRONMENT:-hua-home}"
    environment:
      AKASHIC_CONFIG: "${AKASHIC_CONFIG:?AKASHIC_CONFIG is required}"
      AKASHIC_WORKSPACE: "${AKASHIC_WORKSPACE:?AKASHIC_WORKSPACE is required}"
      AKASHIC_HOST_BRIDGE_SOCKET: "${AKASHIC_HOST_BRIDGE_SOCKET:?AKASHIC_HOST_BRIDGE_SOCKET is required}"
      AKASHIC_HOST_BRIDGE_TOKEN: "${AKASHIC_HOST_BRIDGE_TOKEN:?AKASHIC_HOST_BRIDGE_TOKEN is required}"
      AKASHIC_HOST_TOOLCHAIN_DIGEST: "${AKASHIC_HOST_TOOLCHAIN_DIGEST:?AKASHIC_HOST_TOOLCHAIN_DIGEST is required}"
      AKASHIC_EXECUTION_MODE: host-bridge
      AKASHIC_RUNTIME_COMMIT: "${AKASHIC_RUNTIME_COMMIT:?AKASHIC_RUNTIME_COMMIT is required}"
      AKASHIC_RUNTIME_CHECKOUT: "${AKASHIC_RUNTIME_CHECKOUT:?AKASHIC_RUNTIME_CHECKOUT is required}"
      AKASHIC_LOG_FORMAT: "json"
      AKASHIC_LOG_LEVEL: "${AKASHIC_LOG_LEVEL:-INFO}"
      AKASHIC_SERVICE_NAME: "akashic-core"
      AKASHIC_RELEASE_MANIFEST: /run/akashic-release.json
      AKASHIC_PLUGIN_HOME: "${AKASHIC_EXPERIMENT_ROOT:?AKASHIC_EXPERIMENT_ROOT is required}/plugin-home"
      AKASHIC_WORKLOAD_SOCKET: "${AKASHIC_WORKLOAD_RUNTIME_DIR:-${AKASHIC_EXPERIMENT_ROOT}/workload-runtime}/controller.sock"
      AKASHIC_READINESS_TIMEOUT_S: "${AKASHIC_READINESS_TIMEOUT_S:-120}"
      AKASHIC_WEB_HOST: "0.0.0.0"
      AKASHIC_WEB_ALLOW_NON_LOOPBACK: "1"
      AKASHIC_WEB_PORT: "2236"
      OPENCODE_GO_API_KEY: "${OPENCODE_GO_API_KEY:?OPENCODE_GO_API_KEY is required}"
      HOME: /home/huashen
      TZ: "${TZ:-Asia/Shanghai}"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: "${AKASHIC_EXPERIMENT_ROOT:?AKASHIC_EXPERIMENT_ROOT is required}"
        target: "${AKASHIC_EXPERIMENT_ROOT:?AKASHIC_EXPERIMENT_ROOT is required}"
      - type: bind
        source: "${AKASHIC_HOST_BRIDGE_DIR:?AKASHIC_HOST_BRIDGE_DIR is required}"
        target: "${AKASHIC_HOST_BRIDGE_DIR:?AKASHIC_HOST_BRIDGE_DIR is required}"
      - type: bind
        source: "${AKASHIC_WORKLOAD_RUNTIME_DIR:-${AKASHIC_EXPERIMENT_ROOT}/workload-runtime}"
        target: "${AKASHIC_WORKLOAD_RUNTIME_DIR:-${AKASHIC_EXPERIMENT_ROOT}/workload-runtime}"
      - type: bind
        source: "${AKASHIC_RUNTIME_CHECKOUT:?AKASHIC_RUNTIME_CHECKOUT is required}"
        target: "${AKASHIC_RUNTIME_CHECKOUT:?AKASHIC_RUNTIME_CHECKOUT is required}"
        read_only: true
      - type: bind
        source: "${AKASHIC_RELEASE_MANIFEST:?AKASHIC_RELEASE_MANIFEST is required}"
        target: /run/akashic-release.json
        read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=256m,mode=1777
      - /run:rw,nosuid,nodev,noexec,size=32m,mode=755
      - /home/huashen:rw,nosuid,nodev,exec,size=128m,mode=700,uid=1000,gid=1000
    ports:
      - "${AKASHIC_WEB_BIND_ADDRESS:-127.0.0.1}:${AKASHIC_PUBLISHED_WEB_PORT:-2236}:2236"
      - "127.0.0.1:${AKASHIC_PUBLISHED_MOBILE_PORT:-6323}:6323"
    healthcheck:
      test: ["CMD", "/opt/venv/bin/python", "/opt/akashic/source/docker/host-runtime/healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: "${AKASHIC_READINESS_TIMEOUT_S:-120}s"
    stop_grace_period: 60s
    logging:
      driver: local
      options:
        max-size: "50m"
        max-file: "5"
    restart: "no"
    depends_on:
      workload-controller:
        condition: service_healthy
    networks:
      - default
      - akashic-workloads

  workload-controller:
    image: "${AKASHIC_IMAGE:?AKASHIC_IMAGE is required}"
    container_name: "${AKASHIC_CONTAINER_NAME:?AKASHIC_CONTAINER_NAME is required}-workloads"
    user: "${AKASHIC_UID:-1000}:${AKASHIC_GID:-1000}"
    group_add:
      - "${AKASHIC_DOCKER_GID:?AKASHIC_DOCKER_GID is required}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp
      PYTHONUNBUFFERED: "1"
    entrypoint:
      - /opt/venv/bin/python
      - -m
      - agent.workloads.controller
    command:
      - --workspace
      - "${AKASHIC_WORKSPACE:?AKASHIC_WORKSPACE is required}"
      - --socket
      - "${AKASHIC_WORKLOAD_RUNTIME_DIR:-${AKASHIC_EXPERIMENT_ROOT}/workload-runtime}/controller.sock"
      - --state
      - "${AKASHIC_EXPERIMENT_ROOT:?AKASHIC_EXPERIMENT_ROOT is required}/workload-controller/leases.json"
      - --network
      - "${AKASHIC_WORKLOAD_NETWORK:-akashic-workloads}"
      - --allowed-uid
      - "${AKASHIC_UID:-1000}"
      - --socket-gid
      - "${AKASHIC_GID:-1000}"
      - --socket-uid
      - "${AKASHIC_UID:-1000}"
      - --workload-uid
      - "${AKASHIC_UID:-1000}"
      - --workload-gid
      - "${AKASHIC_GID:-1000}"
      - --owner-container
      - "${AKASHIC_CONTAINER_NAME:?AKASHIC_CONTAINER_NAME is required}"
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
      - type: bind
        source: "${AKASHIC_WORKSPACE:?AKASHIC_WORKSPACE is required}/plugin-data"
        target: "${AKASHIC_WORKSPACE:?AKASHIC_WORKSPACE is required}/plugin-data"
      - type: bind
        source: "${AKASHIC_WORKSPACE:?AKASHIC_WORKSPACE is required}/runtime/plugin-validation"
        target: "${AKASHIC_WORKSPACE:?AKASHIC_WORKSPACE is required}/runtime/plugin-validation"
      - type: bind
        source: "${AKASHIC_WORKLOAD_RUNTIME_DIR:-${AKASHIC_EXPERIMENT_ROOT}/workload-runtime}"
        target: "${AKASHIC_WORKLOAD_RUNTIME_DIR:-${AKASHIC_EXPERIMENT_ROOT}/workload-runtime}"
      - type: bind
        source: "${AKASHIC_EXPERIMENT_ROOT:?AKASHIC_EXPERIMENT_ROOT is required}/workload-controller"
        target: "${AKASHIC_EXPERIMENT_ROOT:?AKASHIC_EXPERIMENT_ROOT is required}/workload-controller"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=32m,mode=1777
      - /run:rw,nosuid,nodev,noexec,size=8m,mode=755
    healthcheck:
      test:
        - CMD
        - /usr/bin/test
        - -S
        - "${AKASHIC_WORKLOAD_RUNTIME_DIR:-${AKASHIC_EXPERIMENT_ROOT}/workload-runtime}/controller.sock"
      interval: 5s
      timeout: 2s
      retries: 12
    stop_grace_period: 45s
    restart: "no"

networks:
  akashic-workloads:
    name: "${AKASHIC_WORKLOAD_NETWORK:-akashic-workloads}"

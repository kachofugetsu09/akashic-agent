name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip install -e sdk/python

      - name: Add project virtualenv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check Host Bridge generated protocol
        run: |
          python -m venv /tmp/akashic-protoc
          /tmp/akashic-protoc/bin/pip install grpcio-tools==1.78.0
          /tmp/akashic-protoc/bin/python scripts/generate_host_bridge_protocol.py --check

      - name: Check Python
        run: |
          .venv/bin/pyright --level error
          .venv/bin/pyright --project pyrightconfig.tests.json --level error
          .venv/bin/python scripts/generate_control_schema.py --check
          python scripts/check_yoyo_migrations.py --base origin/main

      - name: Check Python SDK
        run: |
          cd sdk/python
          ../../.venv/bin/pyright src --level error

      - name: Install Node dependencies
        run: npm ci

      - name: Run Python regressions
        timeout-minutes: 35
        env:
          PYTHONWARNINGS: "ignore:.*AbstractEventLoopPolicy.*:DeprecationWarning"
        run: |
          .venv/bin/pytest -q tests/

      - name: Run frontend typecheck
        run: npm run typecheck

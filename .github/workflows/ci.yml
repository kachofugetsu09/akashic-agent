name: CI

on:
  workflow_dispatch:
  pull_request:
  # main 上也跑：既验合并结果，也建缓存——GitHub 只让默认分支的缓存被所有 PR 共享。
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# 三个 job 并行：Python 检查与回归、前端检查与构建、聊天重连。
# 依赖安装走缓存：Python 用 uv（保留下载过的 wheel），前端按 package-lock.json 整体缓存 node_modules。
jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: |
            requirements*.txt
            sdk/python/pyproject.toml

      - name: Install Python dependencies
        run: |
          uv venv .venv --seed --python 3.12
          uv pip install --python .venv -r requirements-dev.txt -e sdk/python
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check Host Bridge generated protocol
        run: |
          uv venv /tmp/akashic-protoc --python 3.12
          uv pip install --python /tmp/akashic-protoc grpcio-tools==1.78.0
          /tmp/akashic-protoc/bin/python scripts/generate_host_bridge_protocol.py --check

      - name: Lint Python
        run: .venv/bin/ruff check --output-format github .

      - name: Check Python
        run: |
          .venv/bin/pyright --level error
          .venv/bin/pyright --project pyrightconfig.tests.json --level error
          .venv/bin/python scripts/generate_control_schema.py --check
          python scripts/check_yoyo_migrations.py --base origin/main

      - name: Check Python SDK
        run: |
          cd sdk/python
          ../../.venv/bin/pyright src --level error

      - name: Run Python regressions
        timeout-minutes: 35
        env:
          PYTHONWARNINGS: "ignore:.*AbstractEventLoopPolicy.*:DeprecationWarning"
        run: |
          .venv/bin/pytest -q -n auto tests/
          .venv/bin/python scripts/runtime_diagnostics_scenario.py

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Check CSS appearance contract
        run: npm run check:css-tokens

      - name: Check motion contract
        run: npm run check:motion

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          prune-cache: false
          cache-dependency-glob: |
            requirements*.txt
            sdk/python/pyproject.toml

      - name: Build and load plugin web modules
        run: |
          uv venv .venv --seed --python 3.12
          uv pip install --python .venv -r requirements.txt -e sdk/python
          npm run build:web-plugins
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from plugins.ui.web import resolve_web_module

          for path in sorted(Path("plugins").glob("*/web_module.js")):
              resolve_web_module(path.parent, path.name)
              print(f"Loaded {path}")
          PY

  chat-reconnect:
    # 聊天重连行为(短连预算/手动重试/预算重置/stop 帧走新 socket)只能在真实
    # Chromium + 真实 HTTP/WS 下验证,脚本自带 fixture,独立于 check-and-test 单独成job。
    # 用 runner 镜像自带的 Chrome，不再每次下载 Chromium。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}

      - name: Install Node dependencies
        if: steps.node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Verify chat reconnect scenarios
        run: CHROMIUM_PATH="$(command -v google-chrome)" node frontend/plugins/akashic_clients/chat/src/verify-reconnect.mjs

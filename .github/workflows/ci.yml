name: CI

on:
  workflow_dispatch:
  pull_request:
  # 插件仓库的 PR 调用同一套检查：Core 取 main，插件取 PR 提交。
  workflow_call:
    inputs:
      plugins_commit:
        type: string
        required: true
      plugins_base:
        type: string
        default: ""

permissions:
  contents: read

# 固定前缀：被插件仓库调用时 github.workflow 是调用方名称，两个工作流会落进同一组互相取消。
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.plugins_commit && 'kachofugetsu09/akashic-agent' || github.repository }}
          ref: ${{ inputs.plugins_commit && 'main' || '' }}
          fetch-depth: 0

      - name: Compose with plugins
        env:
          BASE: origin/main
          PLUGINS_COMMIT: ${{ inputs.plugins_commit }}
          PLUGINS_BASE: ${{ inputs.plugins_base }}
        run: sh scripts/ci_compose.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt
          .venv/bin/python -m pip install -r requirements-dev.txt
          .venv/bin/python -m pip install -e sdk/python

      - name: Add project virtualenv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Check Host Bridge generated protocol
        run: |
          python -m venv /tmp/akashic-protoc
          /tmp/akashic-protoc/bin/pip install grpcio-tools==1.78.0
          /tmp/akashic-protoc/bin/python scripts/generate_host_bridge_protocol.py --check

      - name: Check Python
        run: |
          .venv/bin/pyright --level error
          .venv/bin/pyright --project pyrightconfig.tests.json --level error
          .venv/bin/python scripts/generate_control_schema.py --check
          python scripts/check_yoyo_migrations.py --base "$COMPOSED_BASE"

      - name: Check Python SDK
        run: |
          cd sdk/python
          ../../.venv/bin/pyright src --level error

      - name: Install Node dependencies
        run: npm ci

      - name: Check CSS appearance contract
        run: npm run check:css-tokens

      - name: Run Python regressions
        timeout-minutes: 35
        env:
          PYTHONWARNINGS: "ignore:.*AbstractEventLoopPolicy.*:DeprecationWarning"
        run: |
          .venv/bin/pytest -q tests/
          .venv/bin/python scripts/runtime_diagnostics_scenario.py

      - name: Run frontend typecheck
        run: npm run typecheck

      - name: Build and load plugin web modules
        run: |
          npm run build:web-plugins
          .venv/bin/python - <<'PY'
          from pathlib import Path
          from plugins.ui.web import resolve_web_module

          for path in sorted(Path("plugins").glob("*/web_module.js")):
              resolve_web_module(path.parent, path.name)
              print(f"Loaded {path}")
          PY

  chat-reconnect:
    # 聊天重连行为(短连预算/手动重试/预算重置/stop 帧走新 socket)只能在真实
    # Chromium + 真实 HTTP/WS 下验证,脚本自带 fixture,独立于 check-and-test 单独成job。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.plugins_commit && 'kachofugetsu09/akashic-agent' || github.repository }}
          ref: ${{ inputs.plugins_commit && 'main' || '' }}

      - name: Compose with plugins
        env:
          PLUGINS_COMMIT: ${{ inputs.plugins_commit }}
        run: sh scripts/ci_compose.sh

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Verify chat reconnect scenarios
        run: CHROMIUM_PATH="$(node -e 'console.log(require("playwright-core").chromium.executablePath())')" node frontend/plugins/akashic_clients/chat/src/verify-reconnect.mjs

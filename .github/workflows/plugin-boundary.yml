name: Plugin boundary

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject new dependency debt, including ledger additions
        env:
          BOUNDARY_BASE: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: python scripts/plugin_boundary.py check --base "$BOUNDARY_BASE"
      - name: User interface and agent operations stay one-to-one
        run: |
          python scripts/check_interaction_parity.py self-test
          python scripts/check_interaction_parity.py check

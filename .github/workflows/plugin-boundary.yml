name: Plugin boundary

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      plugins_commit:
        type: string
        required: true
      plugins_base:
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plugin-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.plugins_commit && 'kachofugetsu09/akashic-agent' || github.repository }}
          ref: ${{ inputs.plugins_commit && 'main' || '' }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compose with plugins
        env:
          BASE: ${{ inputs.plugins_commit && 'origin/main' || github.event.pull_request.base.sha || 'origin/main' }}
          PLUGINS_COMMIT: ${{ inputs.plugins_commit }}
          PLUGINS_BASE: ${{ inputs.plugins_base }}
        run: sh scripts/ci_compose.sh
      - name: Reject new dependency debt, including ledger additions
        run: python scripts/plugin_boundary.py check --base "$COMPOSED_BASE"

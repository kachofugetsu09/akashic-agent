<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <title>Akashic Chat</title>
    <link rel="icon" href="/assets/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
    <style>
      /* 启动壳：在 JS 下载与执行前先画出应用外形，React 首次提交时整棵替换。
         几何镜像真实布局（owner 在 styles.css）：侧栏 clamp(17rem,23vw,20rem) 通高、
         标题带 52px 只盖内容列、阅读列 52rem 偏左 1/4。
         镜像默认侧栏宽度下的阅读态；空态、草稿和已保存的侧栏宽度由应用接管后决定。 */
      body { margin: 0; }
      .boot-shell, .boot-shell * { box-sizing: border-box; }
      .boot-shell {
        display: grid;
        grid-template-columns: clamp(17rem, 23vw, 20rem) minmax(0, 1fr);
        height: 100dvh;
        padding-block-start: env(safe-area-inset-top, 0px);
        background: var(--ak-paper-canvas, #faf9f6);
      }
      .boot-shell__rail {
        display: flex;
        flex-direction: column;
        padding: 12px;
        background: var(--ak-paper-quiet, #f3f1ea);
        border-right: 1px solid var(--ak-rule-subtle, #e6e2d9);
      }
      .boot-shell__rail i,
      .boot-shell__main i {
        display: block;
        border-radius: 8px;
        background: color-mix(in srgb, var(--ak-ink-muted, #8a8578) 14%, transparent);
      }
      .boot-shell__rail-head {
        width: 40%;
        height: 16px;
        margin: 12px 0 16px 10px;
      }
      .boot-shell__rail-search {
        height: 36px;
        margin-bottom: 14px;
      }
      .boot-shell__rail-group {
        width: 30%;
        height: 12px;
        margin: 4px 0 8px 10px;
      }
      .boot-shell__rail-row {
        width: 78%;
        height: 14px;
        margin: 10px 0 10px 10px;
      }
      .boot-shell__rail-foot {
        width: 45%;
        height: 14px;
        margin: 9px 0 9px 10px;
      }
      .boot-shell__rail-row + .boot-shell__rail-foot {
        margin-top: auto;
      }
      .boot-shell__main {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .boot-shell__band {
        flex: none;
        height: 52px;
        border-bottom: 1px solid var(--ak-rule-subtle, #e6e2d9);
      }
      .boot-shell__composer {
        flex: none;
        margin-top: auto;
        margin-bottom: max(20px, env(safe-area-inset-bottom, 0px));
        margin-inline-start: max(6px, calc(max(0px, (100% - 52rem) / 4) - 4px));
        width: min(calc(52rem + 8px), calc(100% - 12px));
        height: 44px;
        border-radius: 22px;
        background: var(--ak-paper-sheet, #f5f3ec);
        border: 1px solid var(--ak-rule-subtle, #e6e2d9);
      }
      @media (max-width: 820px) {
        .boot-shell {
          grid-template-columns: minmax(0, 1fr);
        }
        .boot-shell__rail {
          display: none;
        }
        .boot-shell__composer {
          margin-inline: 18px;
          width: auto;
          height: 56px;
          border-radius: 28px;
        }
      }
      @media (max-width: 36rem) {
        /* 无焦点且无草稿时使用 .composer.is-resting 的单行阅读态。 */
        .boot-shell__composer {
          margin-inline: 16px;
          margin-bottom: max(8px, env(safe-area-inset-bottom, 0px));
          height: 52px;
          border-radius: 26px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-shell" role="status" aria-label="界面载入中">
        <aside class="boot-shell__rail">
          <i class="boot-shell__rail-head"></i>
          <i class="boot-shell__rail-search"></i>
          <i class="boot-shell__rail-group"></i>
          <i class="boot-shell__rail-row"></i>
          <i class="boot-shell__rail-row"></i>
          <i class="boot-shell__rail-row"></i>
          <i class="boot-shell__rail-foot"></i>
          <i class="boot-shell__rail-foot"></i>
        </aside>
        <main class="boot-shell__main">
          <div class="boot-shell__band"></div>
          <div class="boot-shell__composer"></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

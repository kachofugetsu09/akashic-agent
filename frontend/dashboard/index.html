<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akashic Dashboard</title>
  <!-- Shared singletons for dynamically-imported plugin modules: resolves the
       plugin's react / react-dom / @akashic/dashboard-ui imports to host-backed
       shims so plugins reuse the host's single React instance and UI library. -->
  <script type="importmap">
  {
    "imports": {
      "react": "/dashboard/assets/sdk/react.js",
      "react/jsx-runtime": "/dashboard/assets/sdk/jsx-runtime.js",
      "react-dom/client": "/dashboard/assets/sdk/react-dom-client.js",
      "@akashic/dashboard-ui": "/dashboard/assets/sdk/ui.js"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" sizes="any" href="../theme/src/akashic-brand.svg">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Akashic Dashboard</title>
  <script>
    // bootstrap 预热：HTML 解析到这里就发请求，与整个模块图的下载求值并行，不再等
    // dashboard 入口 eval 完才发起（慢链路下省一个多 RTT 的串行段）。消费方是
    // startWebHost（frontend/dashboard/src/webHost.ts），一次性取用后即删除钩子，
    // 重试与夹具页面回退到自行 fetch，语义不变。
    window.__akashicWebUiBootstrap = fetch("/api/chat/web-ui/bootstrap", {headers: {Accept: "application/json"}, cache: "no-cache"});
    window.__akashicWebUiBootstrap.catch(() => {});
  </script>
  <script type="importmap">
  {
    "imports": {
      "react": "/dashboard/assets/sdk/react.js",
      "react/jsx-runtime": "/dashboard/assets/sdk/jsx-runtime.js",
      "react-dom": "/dashboard/assets/sdk/react-dom.js",
      "react-dom/client": "/dashboard/assets/sdk/react-dom-client.js",
      "@akashic/web-ui-v1": "/dashboard/assets/sdk/web-ui-v1.js",
      "@akashic/chat-ui-v1": "/dashboard/assets/sdk/chat-ui-v1.js",
      "@akashic/chat-app-v1": "/assets/chat-app.js"
    }
  }
  </script>
  <!-- 聊天挂载图提前到首波下载：静态 modulepreload 让浏览器解析 head 时就发出请求，与 bootstrap
       并行；modulepreload 不抓依赖分块，所以入口 facade 与它的静态分块都要列出（分块稳定文件名
       由 frontend/chat/vite.config.ts 拥有）。不用提前 import 执行：聊天模块依赖
       window.__akashicRuntime（SDK 垫片顶层解引用），在外壳运行时发布前执行会失败并被模块图缓存住。
       三个 URL 都是稳定名，缓存合同为 ETag 校验（plugins/akashic_clients/static.py），
       暖启动只付一次 304。样式只暖缓存不应用，挂载入口 ensureStylesheet 按 href 去重。 -->
  <!-- Vite 6 recognizes self-closing preload tags when placing the import map. -->
  <link rel="modulepreload" href="/assets/chat-app.js" />
  <link rel="modulepreload" href="/assets/chat-app-mount.js" />
  <link rel="preload" as="style" href="/assets/chat-app.css">
</head>
<body>
  <!-- splash 样式与主题预解析由构建期插件注入 head(vite-splash-plugin.ts,镜像
       frontend/chat/src/styles.css 的 .webui-entry-loading 观感);React 首个 commit
       或 webHost.renderRoot 的 replaceChildren 落地真实 UI 时它才被清掉。 -->
  <div id="root"><p class="akashic-entry-splash">正在载入界面…</p></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

# Akashic 插件边界清单：当前在 Core 源码中声明的字面 ServiceKey。
#
# 本文件的每个条目必须对应代码中真实存在的 ServiceKey，反之亦然；
# 由 `python scripts/plugin_boundary.py check` 强制（R4）。
# 新增声明必须登记 role，否则静态门失败；登记不授予运行时权限。
#
# role 是待逐项复核的现状分类，不是目标 Core 白名单：
#   core  —— 当前由 Core 提供；仍须证明其事实或通用机制归属。
#   seam  —— 协作入口；可替换性必须另外用独立实现验证。
#   bundle—— 默认装配；不得赋予第一方实现特殊入口。
#   claim —— 单 owner 占用声明，不是可注入服务。
#
# Runtime 不读取本表。表不证明消费者权限、原子性或独立安装成功。
# 业务合同可以由普通插件生态拥有；不要求所有共享类型迁入 Core。

[capabilities]

[capabilities."core.credentials"]
role = "seam"
note = "按插件 owner 打开短凭据租约；来源可替换"

# ── 外部运行：进程、MCP、容器 ────────────────────────────────
[capabilities."host.execution.v1"]
role = "seam"
note = "宿主执行端口；由 managed_processes host 提供，不授予任意 Core 访问"

[capabilities.executor]
role = "core"
note = "有界纯同步 worker 池"

# ── 人类与模型入口 ───────────────────────────────────────────


[capabilities."core.host_info"]
role = "core"
note = "宿主装配固定提供 boot identity 与 validation marker 的只读值"

[capabilities."core.runtime_catalog.v1"]
role = "core"
note = "按当前 live Root 提供中立插件、Fiber 与健康只读投影"

[capabilities."core.tasks"]
role = "core"
note = "按通用 key 串行准入的短命工作与资源"

[capabilities."core.restart_gate.v1"]
role = "core"
note = "重启提交权与外部效果 permit"

[capabilities."core.plugin_updates"]
role = "core"
note = "插件 install/uninstall/revert 状态"

# ── 模型协作入口：声明位置不等于提供者归属 ──────────────────


# 尚未实现的文档名称不能重新作为隐式合同出现。
[phantom.SCOPED_TURNS]
note = "多份设计文档称其为已具备的 Turn 原子；实际由 plugins/reply 的 run_reply 顶替"

[phantom.CONTINUATIONS]
note = "content-wake 设计列为现有原子；代码中无此 ServiceKey"

[phantom.BACKGROUND_JOBS]
note = "插件手册与 skill 文档仍在教学使用；代码中无此 ServiceKey"

[capabilities."core.plugin_config.v1"]
role = "core"
note = "按实际 Context 应用自身固定输入；沿 selection CAS 与局部换代，不解释业务字段"

# Akashic 插件边界清单：当前在 Core 源码中声明的字面 ServiceKey。
#
# 本文件的每个条目必须对应代码中真实存在的 ServiceKey，反之亦然；
# 由 `python scripts/plugin_boundary.py check` 强制（R4）。
# 新增声明必须登记 role，否则静态门失败；登记不授予运行时权限。
#
# role 是待逐项复核的现状分类，不是目标 Core 白名单：
#   core  —— 当前由 Core 提供；仍须证明其事实或通用机制归属。
#   seam  —— 协作入口；可替换性必须另外用独立实现验证。
#   bundle—— 默认装配；不得赋予第一方实现特殊入口。
#   claim —— 单 owner 占用声明，不是可注入服务。
#
# Runtime 不读取本表。表不证明消费者权限、原子性或独立安装成功。
# 业务合同可以由普通插件生态拥有；不要求所有共享类型迁入 Core。

[capabilities]

[capabilities."core.message_catalog"]
role = "core"
note = "读取已提交 Message；不授予写入"

[capabilities."core.message_writers"]
role = "core"
note = "按绑定权限追加 Input/Output/ToolResult/Control"

[capabilities."core.message_embeddings"]
role = "core"
note = "读取和追加 Message embedding"

[capabilities."core.session_admission"]
role = "core"
note = "create-once 建立带固定属性的 Session"

[capabilities."core.session_admin"]
role = "core"
note = "Session 软删/恢复、标题覆盖与空标题条件写入；不授予消息减少或物理删除权限"

[capabilities."core.owner_state"]
role = "core"
note = "按插件 owner 隔离的同库事务空间"

[capabilities."core.bindings"]
role = "core"
note = "exact Root 的工具 binding 归档与解析"

# ── 外部效果与投递 ───────────────────────────────────────────
[capabilities."core.artifact_read"]
role = "core"
note = "有界字节读取租约"

[capabilities."core.artifact_import"]
role = "core"
note = "来源导入与不可变引用"

[capabilities."core.channel_attachment_import"]
role = "core"
note = "Channel 附件导入端口；宿主绑定传输与数据，不借用正式数据"

[capabilities."core.channel_attachment_read"]
role = "core"
note = "Channel 附件有界读取端口；与 artifact_read 同一租约边界"

[capabilities."core.channel_identity"]
role = "core"
note = "Channel 身份权威事实读取"

[capabilities."core.credentials"]
role = "seam"
note = "按插件 owner 打开短凭据租约；来源可替换"

# ── 外部运行：进程、MCP、容器 ────────────────────────────────
[capabilities."core.processes"]
role = "core"
note = "宿主统一保留的进程集合与清理核对"

[capabilities."host.execution.v1"]
role = "seam"
note = "宿主执行端口；由 managed_processes host 提供，不授予任意 Core 访问"

[capabilities.executor]
role = "core"
note = "有界纯同步 worker 池"

# ── 人类与模型入口 ───────────────────────────────────────────
[capabilities."ui.messages.v1"]
role = "seam"
note = "UI owner 在本次实际 provider 的调用作用域投影消息，不改写事实"

[capabilities."ui.plugin.v1"]
role = "seam"
note = "UI 插件拥有登记投影、查询准入和物理线程排空"

[capabilities."core.host_info"]
role = "core"
note = "宿主装配固定提供 boot identity 与 validation marker 的只读值"

[capabilities."core.runtime_catalog.v1"]
role = "core"
note = "按当前 live Root 提供中立插件、Fiber 与健康只读投影"

[capabilities."plugin.channels"]
role = "seam"
note = "inbound/outbound Channel 适配注册表；由普通 channels provider 提供，多实现可替换"

[capabilities."core.input_custody"]
role = "core"
note = "durable inbound 的 reserve/defer/recover 托管事实；关闭后幂等结算"

# ── 调度、生命周期与发布 ─────────────────────────────────────
[capabilities."core.tasks"]
role = "core"
note = "按通用 key 串行准入的短命工作与资源"

[capabilities."core.restart_gate.v1"]
role = "core"
note = "重启提交权与外部效果 permit"

[capabilities."core.plugin_updates"]
role = "core"
note = "插件 install/uninstall/revert 状态"

# ── 模型协作入口：声明位置不等于提供者归属 ──────────────────
[capabilities."models.chat.v1"]
role = "seam"
note = "按冻结 revision 取得 chat model"

[capabilities."models.embeddings.v1"]
role = "seam"
note = "统一 embedding space"

[capabilities."models.catalog.v1"]
role = "seam"
note = "模型与 connection 目录"

[capabilities."models.drivers.v1"]
role = "seam"
note = "Provider 注册模型 driver；已有多个可替换实现"

[capabilities."models.call-stats.v1"]
role = "core"
note = "模型调用统计读取"

# ── 占用声明 ─────────────────────────────────────────────────
[capabilities."plugin.claim.embedding_memory"]
role = "claim"
note = "embedding-memory 单 owner 占用；同一 Root 只允许一个"


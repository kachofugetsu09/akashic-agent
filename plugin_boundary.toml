# Akashic 插件边界策略：Core 拥有能力的单一真源。
#
# 本文件的每个条目必须对应代码中真实存在的 ServiceKey，反之亦然；
# 由 `python scripts/plugin_boundary.py check` 强制（R4）。
# 新增一个 Core 能力时，必须同时在这里登记 role，否则门失败。
#
# role 取值（照抄 DeepSeek Harness 的能力角色三分法，另加 claim）：
#   core  —— 独占权威事实或注册表，不提供第二种实现。
#   seam  —— 结构合同 + 可替换实现；消费者只依赖合同，不依赖某个实现。
#   bundle—— 只随产品发布一份具体实现，且扩展插件禁止依赖本包。
#   claim —— 单 owner 占用声明，不是可注入服务。
#
# 未注册的 Core 能力不会被加载；本文件不是愿望清单，而是现状合同。

[capabilities]

# ── Message 与 Session 权威事实 ───────────────────────────────
[capabilities."core.message_catalog"]
role = "core"
note = "读取已提交 Message；不授予写入"

[capabilities."core.message_writers"]
role = "core"
note = "按绑定权限追加 Input/Output/ToolResult/Control"

[capabilities."core.message_embeddings"]
role = "core"
note = "读取和追加 Message embedding"

[capabilities."core.session_admission"]
role = "core"
note = "create-once 建立带固定属性的 Session"

[capabilities."core.owner_state"]
role = "core"
note = "按插件 owner 隔离的同库事务空间"

[capabilities."core.bindings"]
role = "core"
note = "exact Root 的工具 binding 归档与解析"

[capabilities."core.session_read"]
role = "core"
note = "只读既有 Session 投影"

[capabilities."core.session_compaction_storage"]
role = "core"
note = "Session 压缩投影的持久存储"

[capabilities."core.interaction_undo"]
role = "core"
note = "显式撤销最近一次 interaction"

[capabilities."core.conversation.semantic_interest"]
role = "core"
note = "从最近非主动 Turn 生成的只读语义分"

# ── 外部效果与投递 ───────────────────────────────────────────
[capabilities."core.deliveries"]
role = "core"
note = "一条完整逻辑消息的发送边界与 receipt"

[capabilities."core.durable_deliveries"]
role = "core"
note = "跨崩溃恢复的投递尝试与结算"

[capabilities."core.artifact_read"]
role = "core"
note = "有界字节读取租约"

[capabilities."core.artifact_import"]
role = "core"
note = "来源导入与不可变引用"

[capabilities."core.credentials"]
role = "seam"
note = "按插件 owner 打开短凭据租约；来源可替换"

# ── 外部运行：进程、MCP、容器 ────────────────────────────────
[capabilities."core.processes"]
role = "core"
note = "宿主统一保留的进程集合与清理核对"

[capabilities."core.managed_processes"]
role = "core"
note = "受 Core 监督的进程声明注册表"

[capabilities."core.mcp_servers"]
role = "core"
note = "generation-bound MCP server 声明注册表"

[capabilities."core.workloads"]
role = "core"
note = "窄 Controller 管理的容器 workload 注册表"

[capabilities.executor]
role = "core"
note = "有界纯同步 worker 池"

# ── 人类与模型入口 ───────────────────────────────────────────
[capabilities."core.commands"]
role = "core"
note = "人类命令、alias 与 handler 注册表"

[capabilities."core.tool_catalog"]
role = "core"
note = "exact Root 的工具定义与 bound handler"

[capabilities."core.ui_slots"]
role = "core"
note = "Mobile 页面、查询与导航注册表"

[capabilities."core.channels"]
role = "seam"
note = "inbound/outbound Channel 适配注册表；多实现可替换"

[capabilities."channel.input.v1"]
role = "seam"
note = "Channel 入站入口；由 CHANNELS 的注册者提供"

# ── 调度、生命周期与发布 ─────────────────────────────────────
[capabilities."core.timers"]
role = "seam"
note = "one-shot deadline wait；不拥有 recurrence 或 job 语义"

[capabilities."core.tasks"]
role = "core"
note = "按通用 key 串行准入的短命工作与资源"

[capabilities."core.restart_gate.v1"]
role = "core"
note = "重启提交权与外部效果 permit"

[capabilities."core.control_frames.v1"]
role = "core"
note = "控制帧路由与声明"

[capabilities."core.plugin_updates"]
role = "core"
note = "插件 install/uninstall/revert 状态"

# ── 模型：当前唯一已实现的可互换 seam ────────────────────────
[capabilities."models.chat.v1"]
role = "seam"
note = "按冻结 revision 取得 chat model"

[capabilities."models.embeddings.v1"]
role = "seam"
note = "统一 embedding space"

[capabilities."models.catalog.v1"]
role = "seam"
note = "模型与 connection 目录"

[capabilities."models.settings.v1"]
role = "seam"
note = "原子修改模型设置"

[capabilities."models.drivers.v1"]
role = "seam"
note = "Provider 注册模型 driver；已有多个可替换实现"

[capabilities."models.call-stats.v1"]
role = "core"
note = "模型调用统计读取"

# ── 占用声明 ─────────────────────────────────────────────────
# 由插件提供、Core 与其它插件共同消费的 well-known 能力：key 与 Protocol 由
# 结构合同层拥有，实现留在对应插件。消费者只依赖名字与合同，不依赖实现模块，
# 因此 Core 可以在 plugins/ 缺席时正常启动（少了 provider 只影响该能力）。
[capabilities."turn.projection.v1"]
role = "seam"
note = "只读 Turn 投影；实现由 plugins/turn_projection 提供"

[capabilities."tools.v1"]
role = "seam"
note = "工具注册表；实现由 plugins/tools 提供，消费者只依赖合同与 key"

[capabilities."tools.all.v1"]
role = "seam"
note = "全量工具 view 工厂；实现由 plugins/tools 提供"

[capabilities."tools.display-name.v1"]
role = "seam"
note = "工具展示名解析；实现由 plugins/tools 提供"

[capabilities."delivery.senders.v1"]
role = "seam"
note = "普通渠道出站注册表；实现由 plugins/delivery 提供"

[capabilities."reply.status.v1"]
role = "seam"
note = "只读回复状态与预览；实现由 plugins/reply 提供"

[capabilities."plugin.claim.embedding_memory"]
role = "claim"
note = "embedding-memory 单 owner 占用；同一 Root 只允许一个"

# 已记录为「文档承诺、代码未实现」的名字。
# 本清单断言这些名字在 Python 代码中不存在（R5）：一旦有人实现，
# 门会失败，强制同时更新文档与 [capabilities] 登记，避免文档漂移。
[phantom.SCOPED_TURNS]
note = "多份设计文档称其为已具备的 Turn 原子；实际由 plugins/reply 的 run_reply 顶替"

[phantom.CONTINUATIONS]
note = "content-wake 设计列为现有原子；代码中无此 ServiceKey"

[phantom.BACKGROUND_JOBS]
note = "插件手册与 skill 文档仍在教学使用；代码中无此 ServiceKey"

# ── R1 的迁移豁免 ─────────────────────────────────────────────
# R1 保护的是「Core 运行时不得依赖具体插件」，让 plugins/ 可整体移除。
# 迁移不是运行时：它在 runtime 启动前一次性改写由某个插件拥有的持久数据，
# 必须使用该插件自己的 schema 与读写实现。若把 schema 复制进 Core，
# 同一事实就会出现第二个 owner，违反本仓库的「同一事实只有一个 owner」。
#
# 因此迁移 payload 按设计依赖插件，且无法通过迁移消除：
#   - migrations/yoyo/** 已进入 main 的迁移不可修改、移动或删除
#     （scripts/check_yoyo_migrations.py 强制），而已应用的 ledger 仍要求
#     它们可导入；yoyo 的 backend.to_apply() 会 import 每个迁移模块来解析
#     __depends__，所以从零安装的 workspace 也必须有对应插件在场。
#   - agent/migrations/** 是这些不可变迁移的 payload，只被迁移与迁移测试引用。
#
# 这不是欠账，是结构性豁免：它不进 plugin_boundary_baseline.toml（那是「只许
# 减少」的债务），而是被显式登记并在每次 check 输出中打印，避免变成隐藏豁免。
# 详见 docs/decisions/0064-plugin-boundary-is-machine-enforced.md 的「R1 范围裁决」。
[R1_exemptions]
paths = ["agent/migrations/**", "migrations/**"]
reason = "迁移 payload 按设计依赖被迁移插件的数据 schema；yoyo 迁移不可变且启动时被 import"

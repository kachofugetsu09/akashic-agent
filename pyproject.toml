[project]
name = "akashic-agent"
version = "0.1.0"
requires-python = ">=3.12"

# 只做 lint，不统一格式：F 类规则抓没用的导入/变量、未定义名、重复定义。
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# 插件的输入门面按版本别名再导出给同包文件（X_V2 as X），本身不用这些名字。
"plugins/*/inputs.py" = ["F401"]
"plugins/*/boundary.py" = ["F401"]

[dependency-groups]
dev = [
    "rich>=15.0.0",
]

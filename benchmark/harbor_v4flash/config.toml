[agent]
system_prompt = "You are Akashic, a helpful AI assistant with access to tools. Always respond in the same language the user uses."
max_iterations = 0
dev_mode = true

[agent.context.compaction]
keep_recent_tokens = 20000

[agent.tools]
search_enabled = true

[agent.plugins]
disabled_builtin = ["subagent"]

[agent.wiring]
toolsets = ["meta_common"]

[channels.chat]
enabled = false

[app_server]
enabled = true
listen = ""
